<!DOCTYPE html>
<html lang="id" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Kampusale | Marketplace Mahasiswa Tanpa Admin</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@300;400;600;800&display=swap" rel="stylesheet">
    
    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #fcfcfc; }
        .glass { background: rgba(255, 255, 255, 0.8); backdrop-filter: blur(10px); }
        .card-premium { transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275); }
        .card-premium:hover { transform: translateY(-10px); box-shadow: 0 20px 40px rgba(0,0,0,0.1); }
    </style>
</head>
<body class="text-slate-900">

    <nav class="fixed w-full z-50 glass border-b border-slate-200 py-4 px-8 flex justify-between items-center">
        <img src="images/KAMPUS_SALE.png" alt="Logo" class="h-10 cursor-pointer">
        <div class="hidden md:flex items-center gap-8 font-semibold text-slate-600">
            <a href="#" class="hover:text-indigo-600 transition">Beranda</a>
            <a href="#katalog" class="hover:text-indigo-600 transition">Katalog Titipan</a>
            <a href="#" class="hover:text-indigo-600 transition">Alur Perantara</a>
        </div>
        <button class="bg-indigo-600 text-white px-6 py-2.5 rounded-full font-bold hover:bg-indigo-700 transition">Mulai Belanja</button>
    </nav>

    <header class="pt-32 pb-20 px-8 max-w-7xl mx-auto flex flex-col md:flex-row items-center gap-16">
        <div class="flex-1 space-y-6">
            <h1 class="text-6xl font-extrabold leading-[1.1]">Biaya admin marketplace <span class="text-indigo-600">terlalu besar?</span></h1>
            <p class="text-lg text-slate-500 leading-relaxed">Kampusale hadir sebagai perantara jual beli dan sewa barang khusus mahasiswa. Transaksi aman, COD gampang, dan yang pasti 0% biaya admin.</p>
            <div class="flex gap-4">
                <button class="bg-slate-900 text-white px-8 py-4 rounded-2xl font-bold">Lihat Barang Titipan</button>
                <button class="border-2 border-slate-200 px-8 py-4 rounded-2xl font-bold">Cara Kerja</button>
            </div>
        </div>
        <div class="flex-1 w-full bg-slate-100 rounded-[3rem] p-6">
            <img src="https://images.unsplash.com/photo-1522202176988-66273c2fd55f?auto=format&fit=crop&w=800&q=80" class="w-full rounded-[2rem] h-[400px] object-cover">
        </div>
    </header>

    <section id="katalog" class="py-20 px-8 bg-slate-50">
        <div class="max-w-7xl mx-auto">
            <div class="flex flex-col md:flex-row justify-between items-center mb-12 gap-6">
                <h2 class="text-4xl font-bold">Katalog Produk</h2>
                <input type="text" id="search" onkeyup="filter()" placeholder="🔍 Cari barang di kampus..." class="w-full md:w-96 px-6 py-4 rounded-2xl border border-slate-200 shadow-sm outline-none focus:ring-2 focus:ring-indigo-500">
            </div>

            <div id="grid" class="grid grid-cols-1 sm:grid-cols-2 lg:grid-cols-4 gap-8">
                <div class="bg-white p-5 rounded-3xl border border-slate-100 card-premium item" data-name="kipas angin">
                    <img src="images/kipas_angin.png" class="w-full h-48 object-cover rounded-2xl mb-4">
                    <h3 class="font-bold text-lg">Kipas Angin</h3>
                    <p class="text-sm text-slate-400 mb-4">Elektronik</p>
                    <button onclick="order('Kipas Angin')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-semibold">Beli</button>
                </div>
                <div class="bg-white p-5 rounded-3xl border border-slate-100 card-premium item" data-name="baju bapel">
                    <img src="images/baju_bapel.png" class="w-full h-48 object-cover rounded-2xl mb-4">
                    <h3 class="font-bold text-lg">Baju Bapel</h3>
                    <p class="text-sm text-slate-400 mb-4">Fashion</p>
                    <button onclick="order('Baju Bapel')" class="w-full bg-slate-900 text-white py-3 rounded-xl font-semibold">Beli</button>
                </div>
            </div>
        </div>
    </section>

    <script>
        function filter() {
            let s = document.getElementById('search').value.toLowerCase();
            document.querySelectorAll('.item').forEach(i => {
                i.style.display = i.dataset.name.includes(s) ? 'block' : 'none';
            });
        }
        function order(item) {
            let pesan = `Halo, saya ingin membeli ${item}`;
            window.open(`https://wa.me/6281234567890?text=${encodeURIComponent(pesan)}`);
        }
    </script>
</body>
</html>
